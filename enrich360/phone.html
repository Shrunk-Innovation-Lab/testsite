<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile preview · enrich360</title><link rel="icon" href="logo.png">
<style>
body{margin:0;min-height:100vh;background:#E9EBEF;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 12px;box-sizing:border-box}
.phone{width:414px;height:868px;border-radius:56px;background:#111;padding:12px;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);box-sizing:border-box}
iframe{width:390px;height:844px;border:0;border-radius:44px;background:#F2F2F7;display:block}
.bar{display:flex;gap:10px}
a{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:8px;background:rgba(120,120,128,.14);color:#15803D;text-decoration:none;font-weight:600;font-size:15px}
@media (max-width:440px){.phone{all:unset}iframe{width:100vw;height:100vh;border-radius:0}.bar{display:none}body{padding:0}}
</style></head><body>
<div class="bar"><a href="index.html">All screens</a><a id="desk" href="#">Desktop version</a></div>
<div class="phone"><iframe id="f" title="Mobile screen"></iframe></div>
<script>
var q=new URLSearchParams(location.search).get('f')||'Glass-Today-Mobile.dc.html';
if(!/^Glass-[A-Za-z]+(-Mobile)?\.dc\.html$/.test(q)) q='Glass-Today-Mobile.dc.html';
document.getElementById('f').src=q;
document.getElementById('desk').href=q.replace('-Mobile','');
</script></body></html>
